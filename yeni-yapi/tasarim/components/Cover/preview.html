<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: var(--erp-page); }
  .kap { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .kap > svg { position: absolute; inset: 0; }
  .shell { fill: var(--erp-shell); } .shell2 { fill: var(--erp-shell-2); }
  .accent { fill: var(--erp-accent); } .tint { fill: var(--erp-accent-tint); }
  .head { fill: var(--erp-head); } .zebra { fill: var(--erp-zebra); } .panel { fill: var(--erp-panel); stroke: var(--erp-line-soft); stroke-width: 1; }
  .sm { rx: var(--erp-r-sm); } .md { rx: var(--erp-r-md); }
  .ad { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .ad h1 { margin: 0; font-family: var(--font-sans); font-weight: 800; font-size: 112px; line-height: .92; color: var(--erp-text); letter-spacing: -.01em; }
  .ad p { margin: 12px 0 0; font-family: var(--font-sans); font-size: 14px; color: var(--erp-text-2); }
</style></head>
<body>
<div class="kap">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
